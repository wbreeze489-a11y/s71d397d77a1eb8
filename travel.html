    // document.write can leave the tab on the default icon; re-add it under a new URL to force a fetch
    document.querySelectorAll('link[rel~=icon]').forEach(function (l) { l.remove(); });
    [['image/png', 'favicon.png?v=4', ''], ['image/x-icon', 'favicon.ico?v=4', 'any']].forEach(function (d) {
      var l = document.createElement('link');
      l.rel = 'icon'; l.type = d[0]; l.href = d[1]; if (d[2]) l.sizes = d[2];
      document.head.appendChild(l);
    });
  }
  function get() { try { return localStorage.getItem('gate-pw'); } catch (e) { return null; } }
  function put(v) { try { localStorage.setItem('gate-pw', v); } catch (e) {} }
  function drop() { try { localStorage.removeItem('gate-pw'); } catch (e) {} }

  if (!window.crypto || !crypto.subtle) {
    gate.hidden = false;
    err.textContent = 'This page needs a modern browser opened over https.';
    return;
  }
  // A secret in the link (teeze.site/#secret) opens the site without typing anything
  var hashPw = '';
  try { hashPw = decodeURIComponent((location.hash || '').slice(1)); } catch (e) {}
  function fromStore() {
    var saved = get();
    if (!saved) { gate.hidden = false; return; }
    decrypt(saved).then(show, function () { drop(); gate.hidden = false; });
  }
  if (hashPw) {
    decrypt(hashPw).then(function (html) { put(hashPw); show(html); }, fromStore);
  } else {
    fromStore();
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    err.textContent = '';
    decrypt(pw).then(function (html) { put(pw); show(html); },
                     function () { err.textContent = "That isn't the right password."; });
  });
})();
</script>
</body>
</html>
