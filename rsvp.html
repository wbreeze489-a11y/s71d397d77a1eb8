    decrypt(hashPw).then(function (html) { put(hashPw); show(html); }, fromStore);
  } else {
    fromStore();
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    err.textContent = '';
    decrypt(pw).then(function (html) { put(pw); show(html); },
                     function () { err.textContent = "That isn't the right password."; });
  });
})();
</script>
